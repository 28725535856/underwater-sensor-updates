name: Publish sensor 1.1.2 and direct delta update
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-1.1.2.yml'
permissions:
  contents: write
concurrency:
  group: publish-sensor-1.1.2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify signed release files, mirror assets, then advance manifests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sensor-release-1.1.2"
          cd "$RUNNER_TEMP/sensor-release-1.1.2"
          python3 - <<'PY'
          import os, pathlib, hashlib, json, base64, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          stage = 'https://underwater-sensor-updates-20261104.z2656953367.chatgpt.site/releases/'
          direct = 'https://raw.githubusercontent.com/' + repo + '/main/'
          assets = [('underwater-sensor-1.1.2.apk', 5221345, '7df1fb93c10340d65d6d37e8707752ec500a41e369d6a76bfb59f68165313b89'), ('underwater-sensor-1.1.1-to-1.1.2.sud.gz', 274752, 'eb130a31f0b82d7c878b46146ae26d79a2592c4214100e1819ef42694044f196'), ('underwater-sensor-1.0.14-to-1.1.2.sud.gz', 281691, '99e0812c078c5f7e9f1328ef88c18d95044d1f6d51e86d143323f6ab7f8269ca'), ('underwater-sensor-1.1.0-to-1.1.2.sud.gz', 265231, '6521b0e3a6eee430014fe16695774403f31d3aeaae56b40584204d35a3374043')]
          for name, size, sha in assets:
              subprocess.run(['curl', '--fail', '--location', '--silent', '--show-error',
                  '--proto', '=https', '--proto-redir', '=https', '--connect-timeout', '15',
                  '--max-time', '180', '--retry', '2', stage + name, '--output', name], check=True)
              data = pathlib.Path(name).read_bytes()
              assert len(data) == size and hashlib.sha256(data).hexdigest() == sha, 'Release asset verification failed'
              print('Verified release asset:', name, size)
          manifest = {'versionCode': 18, 'versionName': '1.1.2', 'apkUrl': 'https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/packages/underwater-sensor-1.1.2.apk', 'apkBytes': 5221345, 'sha256': '7df1fb93c10340d65d6d37e8707752ec500a41e369d6a76bfb59f68165313b89', 'notes': '无需烧录。按要求先预缓存约8个真实点，再固定节奏逐点显示；默认650ms/点，启动阶段若测得到包更慢，会在开始显示前确定一次更长间隔，开始后不再自动变速。停止时即使未攒够8点也会释放已收缓存。减少图表重复初始化，保留原始采样时间、ADC、超量程和完整导出。改善显示均匀性，会增加起步及缓存延迟；原板仍分批回传，长时间没数据时仍需等待。', 'deltas': [{'fromVersionCode': 17, 'baseSha256': '76a44c37153723d55af3911c710693b68921a9aa18916dc263357fc0f0ad4026', 'url': 'https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/packages/underwater-sensor-1.1.1-to-1.1.2.sud.gz', 'bytes': 274752, 'sha256': 'eb130a31f0b82d7c878b46146ae26d79a2592c4214100e1819ef42694044f196'}, {'fromVersionCode': 15, 'baseSha256': '2d68fb03e5afb2e3d0fc63e6d4fc443f9934429693e54d32fc7201852bf7f0c0', 'url': 'https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/packages/underwater-sensor-1.0.14-to-1.1.2.sud.gz', 'bytes': 281691, 'sha256': '99e0812c078c5f7e9f1328ef88c18d95044d1f6d51e86d143323f6ab7f8269ca'}, {'fromVersionCode': 16, 'baseSha256': 'f0fad97f9f0343b7a1572dad039bf6e4807712cd59d1195c4b2e17d0d4063ef5', 'url': 'https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/packages/underwater-sensor-1.1.0-to-1.1.2.sud.gz', 'bytes': 265231, 'sha256': '6521b0e3a6eee430014fe16695774403f31d3aeaae56b40584204d35a3374043'}]}
          content = (json.dumps(manifest, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
          pathlib.Path('latest.json').write_bytes(content)
          notes = '水下传感器1.1.2（18），Android6及以上。\n无需烧录。按要求先预缓存约8个真实点，再固定节奏逐点显示；默认650ms/点，启动阶段若测得到包更慢，会在开始显示前确定一次更长间隔，开始后不再自动变速。停止时即使未攒够8点也会释放已收缓存。减少图表重复初始化，保留原始采样时间、ADC、超量程和完整导出。改善显示均匀性，会增加起步及缓存延迟；原板仍分批回传，长时间没数据时仍需等待。\n123项测试、3个实际Java增量还原、签名及对齐通过。30批输入模型中出队间隔固定650ms；这是模拟，不是手机实测。\n仅公开APK、差异包及说明，不公开源码、私钥或测量数据。'
          pathlib.Path('release-notes.md').write_text(notes, encoding='utf-8')
          existing = subprocess.run(['gh','release','view','v1.1.2','--repo',repo], capture_output=True)
          if existing.returncode != 0:
              subprocess.run(['gh','release','create','v1.1.2']+[a[0] for a in assets]+['latest.json',
                  '--repo',repo,'--target',os.environ['GITHUB_SHA'],'--latest',
                  '--title','水下传感器 1.1.2 · 预缓存后固定节奏，无需烧录','--notes-file','release-notes.md'], check=True)
          def put(path, data, immutable=False):
              endpoint = 'repos/' + repo + '/contents/' + path
              result = subprocess.run(['gh','api',endpoint], capture_output=True, text=True)
              previous = json.loads(result.stdout) if result.returncode == 0 else None
              blob = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if previous and previous['sha'] == blob:
                  print('Verified existing content:', path); return
              if immutable and previous:
                  raise RuntimeError('Immutable asset differs: '+path)
              payload = {'message':'Publish verified sensor 1.1.2: '+path,
                  'content':base64.b64encode(data).decode('ascii'), 'branch':'main'}
              if previous: payload['sha'] = previous['sha']
              temporary = pathlib.Path('contents-payload.json')
              temporary.write_text(json.dumps(payload), encoding='utf-8')
              response = subprocess.run(['gh','api','--method','PUT',endpoint,'--input',str(temporary)],
                  capture_output=True, text=True, check=True)
              assert json.loads(response.stdout)['content']['sha'] == blob
              temporary.unlink()
              print('Published:',path)
          # Versioned assets must exist before any phone is offered the new version.
          for name, size, sha in assets: put('packages/'+name, pathlib.Path(name).read_bytes(), True)
          put('updates/latest.json',content)
          put('latest.json',content)
          readme = '# 水下传感器应用更新\n\n当前版本1.1.2（18），无需烧录。\n\n清单：https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/updates/latest.json\n\n无需烧录。按要求先预缓存约8个真实点，再固定节奏逐点显示；默认650ms/点，启动阶段若测得到包更慢，会在开始显示前确定一次更长间隔，开始后不再自动变速。停止时即使未攒够8点也会释放已收缓存。减少图表重复初始化，保留原始采样时间、ADC、超量程和完整导出。改善显示均匀性，会增加起步及缓存延迟；原板仍分批回传，长时间没数据时仍需等待。\n\n123项测试及构建校验通过，手机表现待复测。\n'
          put('README.md',readme.encode('utf-8'))
          PY




