name: Publish sensor 1.0.14 and direct delta update
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-1.0.14.yml'
permissions:
  contents: write
concurrency:
  group: publish-sensor-1.0.14
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify signed release files, mirror assets, then advance manifests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sensor-release-1.0.14"
          cd "$RUNNER_TEMP/sensor-release-1.0.14"
          python3 - <<'PY'
          import os, pathlib, hashlib, json, base64, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          stage = 'https://underwater-sensor-updates-20261104.z2656953367.chatgpt.site/releases/'
          direct = 'https://raw.githubusercontent.com/' + repo + '/main/'
          assets = [('underwater-sensor-1.0.14.apk',
            5234945,
            '2d68fb03e5afb2e3d0fc63e6d4fc443f9934429693e54d32fc7201852bf7f0c0'),
           ('underwater-sensor-1.0.13-to-1.0.14.sud.gz',
            275254,
            '7376a3e0ef37c44f4f43b49ff12d78603ade6713b4110b24bd835d1f688c2edd')]
          for name, size, sha in assets:
              subprocess.run(['curl', '--fail', '--location', '--silent', '--show-error',
                  '--proto', '=https', '--proto-redir', '=https', '--connect-timeout', '15',
                  '--max-time', '180', '--retry', '2', stage + name, '--output', name], check=True)
              data = pathlib.Path(name).read_bytes()
              assert len(data) == size and hashlib.sha256(data).hexdigest() == sha, 'Release asset verification failed'
              print('Verified release asset:', name, size)
          manifest = {'versionCode': 15,
           'versionName': '1.0.14',
           'apkUrl': 'https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/packages/underwater-sensor-1.0.14.apk',
           'apkBytes': 5234945,
           'sha256': '2d68fb03e5afb2e3d0fc63e6d4fc443f9934429693e54d32fc7201852bf7f0c0',
           'notes': '按要求恢复原版业务流程：开始检测仅发送一次3031，数据读取才发送3032；取消主按钮的自动重启采样和批量轮询，读取不再只查看缓存。保留权限兼容、短包/分包越界防护、传感器选择、Excel、120万Ω显示上限及App内更新。不修改采集板固件。',
           'deltas': [{'fromVersionCode': 14,
                       'baseSha256': '47b79ebd5324a1f2df644f3d1b8b5574191c9a6e3074d02eb1af21dbd0d4e49f',
                       'url': 'https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/packages/underwater-sensor-1.0.13-to-1.0.14.sud.gz',
                       'bytes': 275254,
                       'sha256': '7376a3e0ef37c44f4f43b49ff12d78603ade6713b4110b24bd835d1f688c2edd'}]}
          content = (json.dumps(manifest, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
          pathlib.Path('latest.json').write_bytes(content)
          notes = '''水下传感器1.0.14（15），Android6及以上。
          按要求恢复原版业务流程：开始检测仅发送一次3031，数据读取才发送3032；取消主按钮的自动重启采样和批量轮询，读取不再只查看缓存。保留权限兼容、短包/分包越界防护、传感器选择、Excel、120万Ω显示上限及App内更新。不修改采集板固件。
          本次仅改主按钮路由及版本号。28项分包、解析、批量Excel测试通过；编译、原签名、zipalign及差异精确还原通过。
          本次恢复原程序开始/读取两步交互，不宣称改变固件的上报方式。安装后核对当前版本1.0.14（15），按原流程测试。
          仅公开APK、差异包及更新说明，无源码、签名私钥或测量数据。
          '''
          pathlib.Path('release-notes.md').write_text(notes, encoding='utf-8')
          existing = subprocess.run(['gh','release','view','v1.0.14','--repo',repo], capture_output=True)
          if existing.returncode != 0:
              subprocess.run(['gh','release','create','v1.0.14']+[a[0] for a in assets]+['latest.json',
                  '--repo',repo,'--target',os.environ['GITHUB_SHA'],'--latest',
                  '--title','水下传感器 1.0.14 · 恢复原程序流程','--notes-file','release-notes.md'], check=True)
          def put(path, data, immutable=False):
              endpoint = 'repos/' + repo + '/contents/' + path
              result = subprocess.run(['gh','api',endpoint], capture_output=True, text=True)
              previous = json.loads(result.stdout) if result.returncode == 0 else None
              blob = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if previous and previous['sha'] == blob:
                  print('Verified existing content:', path); return
              if immutable and previous:
                  raise RuntimeError('Immutable asset differs: '+path)
              payload = {'message':'Publish verified sensor 1.0.14: '+path,
                  'content':base64.b64encode(data).decode('ascii'), 'branch':'main'}
              if previous: payload['sha'] = previous['sha']
              temporary = pathlib.Path('contents-payload.json')
              temporary.write_text(json.dumps(payload), encoding='utf-8')
              response = subprocess.run(['gh','api','--method','PUT',endpoint,'--input',str(temporary)],
                  capture_output=True, text=True, check=True)
              assert json.loads(response.stdout)['content']['sha'] == blob
              temporary.unlink()
              print('Published:',path)
          # Versioned assets must exist before any phone is offered the new version.
          for name, size, sha in assets: put('packages/'+name, pathlib.Path(name).read_bytes(), True)
          put('updates/latest.json',content)
          put('latest.json',content)
          readme = '''# 水下传感器应用更新
          
          当前版本1.0.14（15）。
          
          更新清单：https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/updates/latest.json
          
          按要求恢复原版业务流程：开始检测仅发送一次3031，数据读取才发送3032；取消主按钮的自动重启采样和批量轮询，读取不再只查看缓存。保留权限兼容、短包/分包越界防护、传感器选择、Excel、120万Ω显示上限及App内更新。不修改采集板固件。
          
          恢复原程序开始/读取两步交互：开始后采样，点击读取再显示返回数据。固件是否连续主动上报须以其实际程序为准。
          
          28项关联测试与原签名、差异还原校验通过，手机行为待验证。
          '''
          put('README.md',readme.encode('utf-8'))
          PY




