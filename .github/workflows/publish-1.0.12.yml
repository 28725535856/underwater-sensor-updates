name: Publish sensor 1.0.12 and direct delta update
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-1.0.12.yml'
permissions:
  contents: write
concurrency:
  group: publish-sensor-1.0.12
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify signed release files, mirror assets, then advance manifests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sensor-release-1.0.12"
          cd "$RUNNER_TEMP/sensor-release-1.0.12"
          python3 - <<'PY'
          import os, pathlib, hashlib, json, base64, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          stage = 'https://underwater-sensor-updates-20261104.z2656953367.chatgpt.site/releases/'
          direct = 'https://raw.githubusercontent.com/' + repo + '/main/'
          assets = [('underwater-sensor-1.0.12.apk',
            5234945,
            '619aa559ce1ca36f3d3a8ca01ad73eeb52347d88fe6d478f08960afa5d875db2'),
           ('underwater-sensor-1.0.10-to-1.0.12.sud.gz',
            265466,
            '2a9b1c08310424df300c85cdc099b7978ac74e077864445efee10428e45d2c51'),
           ('underwater-sensor-1.0.11-to-1.0.12.sud.gz',
            253739,
            '692a58f289b7e56a4eff88b0c07c63542687f22aade20e99d9da487b58d01abd')]
          for name, size, sha in assets:
              subprocess.run(['curl', '--fail', '--location', '--silent', '--show-error',
                  '--proto', '=https', '--proto-redir', '=https', '--connect-timeout', '15',
                  '--max-time', '180', '--retry', '2', stage + name, '--output', name], check=True)
              data = pathlib.Path(name).read_bytes()
              assert len(data) == size and hashlib.sha256(data).hexdigest() == sha, 'Release asset verification failed'
              print('Verified release asset:', name, size)
          manifest = {'versionCode': 13,
           'versionName': '1.0.12',
           'apkUrl': 'https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/packages/underwater-sensor-1.0.12.apk',
           'apkBytes': 5234945,
           'sha256': '619aa559ce1ca36f3d3a8ca01ad73eeb52347d88fe6d478f08960afa5d875db2',
           'notes': '减少刷新停顿：启动确认后等待由1500ms减至250ms，轮间等待由250ms减至50ms，每轮固定等待减少1450ms。保留1.2MΩ上限、ADC255超量程、连续趋势线和原始数据导出。仍采用原板的启动/读取轮询，实际刷新还包含传感器响应时间，须手机实测。',
           'deltas': [{'fromVersionCode': 11,
                       'baseSha256': 'cb0700924f9c7d52747b0b53ad8e13db709a1ce95a05c35ecc4961db1d04666b',
                       'url': 'https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/packages/underwater-sensor-1.0.10-to-1.0.12.sud.gz',
                       'bytes': 265466,
                       'sha256': '2a9b1c08310424df300c85cdc099b7978ac74e077864445efee10428e45d2c51'},
                      {'fromVersionCode': 12,
                       'baseSha256': 'e64bd5882f2bbf064af2ff3183432bf4af006c260f3e33fc47c11611370af67e',
                       'url': 'https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/packages/underwater-sensor-1.0.11-to-1.0.12.sud.gz',
                       'bytes': 253739,
                       'sha256': '692a58f289b7e56a4eff88b0c07c63542687f22aade20e99d9da487b58d01abd'}]}
          content = (json.dumps(manifest, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
          pathlib.Path('latest.json').write_bytes(content)
          notes = '''水下传感器1.0.12（13），Android6及以上。
          减少固定等待：启动确认后1500ms→250ms，轮间250ms→50ms，每轮程序等待合计1750ms→300ms。
          沿用现有3031/3032协议，实际刷新还需加上传感器回应、传输与系统调度时间，不承诺固定频率或无间断采样。
          120万Ω软件上限、ADC255超量程标记、连续趋势连线、停止和Excel原始数据保持。
          只修改自动等待常量、对应诊断说明和版本号，不增加未知指令，不插入虚构样本。
          63项接收、解析、诊断模型及自动状态测试通过；Java/D8、签名、zipalign通过，两种差异包均用App同一Java实现准确重建。
          从1.0.10或1.0.11可直接差异升级，完成系统安装确认后核对当前版本1.0.12（13）。
          250ms采集窗口下的实际板端返回样本数和刷新间隔仍需手机实测。
          本仓库仅发布APK、差异包及说明，不包含源码、私钥或测量数据。
          '''
          pathlib.Path('release-notes.md').write_text(notes, encoding='utf-8')
          existing = subprocess.run(['gh','release','view','v1.0.12','--repo',repo], capture_output=True)
          if existing.returncode != 0:
              subprocess.run(['gh','release','create','v1.0.12']+[a[0] for a in assets]+['latest.json',
                  '--repo',repo,'--target',os.environ['GITHUB_SHA'],'--latest',
                  '--title','水下传感器 1.0.12 · 减少刷新等待','--notes-file','release-notes.md'], check=True)
          def put(path, data, immutable=False):
              endpoint = 'repos/' + repo + '/contents/' + path
              result = subprocess.run(['gh','api',endpoint], capture_output=True, text=True)
              previous = json.loads(result.stdout) if result.returncode == 0 else None
              blob = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if previous and previous['sha'] == blob:
                  print('Verified existing content:', path); return
              if immutable and previous:
                  raise RuntimeError('Immutable asset differs: '+path)
              payload = {'message':'Publish verified sensor 1.0.12: '+path,
                  'content':base64.b64encode(data).decode('ascii'), 'branch':'main'}
              if previous: payload['sha'] = previous['sha']
              temporary = pathlib.Path('contents-payload.json')
              temporary.write_text(json.dumps(payload), encoding='utf-8')
              response = subprocess.run(['gh','api','--method','PUT',endpoint,'--input',str(temporary)],
                  capture_output=True, text=True, check=True)
              assert json.loads(response.stdout)['content']['sha'] == blob
              temporary.unlink()
              print('Published:',path)
          # Versioned assets must exist before any phone is offered the new version.
          for name, size, sha in assets: put('packages/'+name, pathlib.Path(name).read_bytes(), True)
          put('updates/latest.json',content)
          put('latest.json',content)
          readme = '''# 水下传感器应用更新
          
          当前版本：1.0.12（13），Android6及以上。
          
          App更新清单：https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/updates/latest.json
          
          本版减少刷新停顿，每轮程序固定等待从1.75秒降至0.30秒，实际刷新还包含硬件响应与传输时间。
          
          保留120万Ω软件上限、ADC255超量程、连续趋势连线和真实数据导出。段间有采集间隙，连线仅表示趋势。
          
          开始后保持App前台，停止后查看或导出本次记录。从1.0.10/1.0.11可直接差异升级。
          
          安装完成后确认当前版本1.0.12（13）。63项相关测试与签名、差异重建校验通过；手机刷新效果待验证。
          
          本仓库仅发布APK、差异包和版本说明。
          '''
          put('README.md',readme.encode('utf-8'))
          PY




