name: Publish sensor 1.1.4 and direct delta update
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-1.1.4.yml'
permissions:
  contents: write
concurrency:
  group: publish-sensor-1.1.4
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify signed release files, mirror assets, then advance manifests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sensor-release-1.1.4"
          cd "$RUNNER_TEMP/sensor-release-1.1.4"
          python3 - <<'PY'
          import os, pathlib, hashlib, json, base64, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          stage = 'https://underwater-sensor-updates-20261104.z2656953367.chatgpt.site/releases/'
          direct = 'https://raw.githubusercontent.com/' + repo + '/main/'
          assets = [('underwater-sensor-1.1.4.apk', 5225441, '745ea8bbe7c18a5cbcaeae5641fa9bbfca7dfcd3bee674604da5e36ec3d8952a'), ('underwater-sensor-1.1.3-to-1.1.4.sud.gz', 283573, '89687661eac828471f3c1fdab33721bb43e7e70ec9723038ad7187ac32ec636c')]
          import gzip, struct, io
          def download(url, dest):
              subprocess.run(['curl','--fail','--location','--silent','--show-error','--retry','2','--max-time','180',url,'--output',dest],check=True)
          download(direct+'packages/underwater-sensor-1.1.3.apk','base.apk')
          download(direct+'packages/underwater-sensor-1.1.3-to-1.1.4.sud.gz','underwater-sensor-1.1.3-to-1.1.4.sud.gz')
          old=pathlib.Path('base.apk').read_bytes()
          stream=io.BytesIO(gzip.decompress(pathlib.Path('underwater-sensor-1.1.3-to-1.1.4.sud.gz').read_bytes()))
          magic,oldsize,newsize=struct.unpack('>Iqq',stream.read(20));oldhash,newhash=stream.read(32),stream.read(32)
          assert magic==0x53554431 and oldsize==len(old) and hashlib.sha256(old).digest()==oldhash and newsize<128*1024*1024
          result=bytearray()
          while True:
              op=stream.read(1)
              if op==b'\x7f':break
              if op==b'\0':
                  pos,n=struct.unpack('>qI',stream.read(12));assert pos>=0 and pos+n<=len(old);result+=old[pos:pos+n]
              else:
                  assert op==b'\1';n=struct.unpack('>I',stream.read(4))[0];result+=stream.read(n)
              assert len(result)<=newsize
          assert len(result)==newsize and hashlib.sha256(result).digest()==newhash
          pathlib.Path('underwater-sensor-1.1.4.apk').write_bytes(result)
          for name,size,sha in assets:
              data=pathlib.Path(name).read_bytes();assert len(data)==size and hashlib.sha256(data).hexdigest()==sha
          manifest = {'versionCode': 20, 'versionName': '1.1.4', 'apkUrl': 'https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/packages/underwater-sensor-1.1.4.apk', 'apkBytes': 5225441, 'sha256': '745ea8bbe7c18a5cbcaeae5641fa9bbfca7dfcd3bee674604da5e36ec3d8952a', 'notes': '无需烧录。修复单次完整异常帧导致整场自动停止的问题：拒收该包、保留有效记录并继续下一段，连续8轮异常仍提示停止。图表围绕实际阻值显示小变化，坐标范围只向外扩展；保持原始ADC、电阻公式与完整导出。3000轮长时间循环模拟及137项测试通过，手机待验证。原板仍为8位分段采样，不能靠绘图提高真实分辨率。', 'deltas': [{'fromVersionCode': 19, 'baseSha256': 'f0c9500ca9f60d4afba258814c57457e7549259f60c33586f2d9f848c309bd44', 'url': 'https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/packages/underwater-sensor-1.1.3-to-1.1.4.sud.gz', 'bytes': 283573, 'sha256': '89687661eac828471f3c1fdab33721bb43e7e70ec9723038ad7187ac32ec636c'}]}
          content = (json.dumps(manifest, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
          pathlib.Path('latest.json').write_bytes(content)
          notes = '无需烧录。修复单次完整异常帧导致整场自动停止的问题：拒收该包、保留有效记录并继续下一段，连续8轮异常仍提示停止。图表围绕实际阻值显示小变化，坐标范围只向外扩展；保持原始ADC、电阻公式与完整导出。3000轮长时间循环模拟及137项测试通过，手机待验证。原板仍为8位分段采样，不能靠绘图提高真实分辨率。'
          pathlib.Path('release-notes.md').write_text(notes, encoding='utf-8')
          existing = subprocess.run(['gh','release','view','v1.1.4','--repo',repo], capture_output=True)
          if existing.returncode != 0:
              subprocess.run(['gh','release','create','v1.1.4']+[a[0] for a in assets]+['latest.json',
                  '--repo',repo,'--target',os.environ['GITHUB_SHA'],'--latest',
                  '--title','水下传感器 1.1.4 · 小缓存与显示稳定性修复','--notes-file','release-notes.md'], check=True)
          def put(path, data, immutable=False):
              endpoint = 'repos/' + repo + '/contents/' + path
              result = subprocess.run(['gh','api',endpoint], capture_output=True, text=True)
              previous = json.loads(result.stdout) if result.returncode == 0 else None
              blob = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if previous and previous['sha'] == blob:
                  print('Verified existing content:', path); return
              if immutable and previous:
                  raise RuntimeError('Immutable asset differs: '+path)
              payload = {'message':'Publish verified sensor 1.1.4: '+path,
                  'content':base64.b64encode(data).decode('ascii'), 'branch':'main'}
              if previous: payload['sha'] = previous['sha']
              temporary = pathlib.Path('contents-payload.json')
              temporary.write_text(json.dumps(payload), encoding='utf-8')
              response = subprocess.run(['gh','api','--method','PUT',endpoint,'--input',str(temporary)],
                  capture_output=True, text=True, check=True)
              assert json.loads(response.stdout)['content']['sha'] == blob
              temporary.unlink()
              print('Published:',path)
          # Versioned assets must exist before any phone is offered the new version.
          for name, size, sha in assets: put('packages/'+name, pathlib.Path(name).read_bytes(), True)
          put('updates/latest.json',content)
          put('latest.json',content)
          readme = '# 水下传感器更新\n\n当前版本1.1.4（20）\n\n无需烧录。修复单次完整异常帧导致整场自动停止的问题：拒收该包、保留有效记录并继续下一段，连续8轮异常仍提示停止。图表围绕实际阻值显示小变化，坐标范围只向外扩展；保持原始ADC、电阻公式与完整导出。3000轮长时间循环模拟及137项测试通过，手机待验证。原板仍为8位分段采样，不能靠绘图提高真实分辨率。\n\n清单：https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/updates/latest.json\n'
          put('README.md',readme.encode('utf-8'))
          PY




