name: Publish sensor 1.1.7 and direct delta update
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-1.1.7.yml'
permissions:
  contents: write
concurrency:
  group: publish-sensor-1.1.7
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify signed release files, mirror assets, then advance manifests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sensor-release-1.1.7"
          cd "$RUNNER_TEMP/sensor-release-1.1.7"
          python3 - <<'PY'
          import os, pathlib, hashlib, json, base64, subprocess
          repo = os.environ['GITHUB_REPOSITORY']

          direct = 'https://raw.githubusercontent.com/' + repo + '/main/'
          assets = [["underwater-sensor-1.1.7.apk",5228724,"2ba879e57b8dee0da73c8aab4a17ae42c8ab143219e08cfd5b064f3522b2ff91"],["underwater-sensor-1.1.6-to-1.1.7.sud.gz",287865,"332f0a525f3d198afb9d2970e86ae97baadad071a9a6214b42fc0494d0af6cb0"]]
          import gzip, struct, io
          def download(url, dest):
              subprocess.run(['curl','--fail','--location','--silent','--show-error','--retry','2','--max-time','180',url,'--output',dest],check=True)
          download(direct+'packages/underwater-sensor-1.1.6.apk','base.apk')
          download(direct+'packages/underwater-sensor-1.1.6-to-1.1.7.sud.gz','underwater-sensor-1.1.6-to-1.1.7.sud.gz')
          old=pathlib.Path('base.apk').read_bytes()
          stream=io.BytesIO(gzip.decompress(pathlib.Path('underwater-sensor-1.1.6-to-1.1.7.sud.gz').read_bytes()))
          magic,oldsize,newsize=struct.unpack('>Iqq',stream.read(20));oldhash,newhash=stream.read(32),stream.read(32)
          assert magic==0x53554431 and oldsize==len(old) and hashlib.sha256(old).digest()==oldhash and newsize<128*1024*1024
          result=bytearray()
          while True:
              op=stream.read(1)
              if op==b'\x7f':break
              if op==b'\0':
                  pos,n=struct.unpack('>qI',stream.read(12));assert pos>=0 and pos+n<=len(old);result+=old[pos:pos+n]
              else:
                  assert op==b'\1';n=struct.unpack('>I',stream.read(4))[0];result+=stream.read(n)
              assert len(result)<=newsize
          assert len(result)==newsize and hashlib.sha256(result).digest()==newhash
          pathlib.Path('underwater-sensor-1.1.7.apk').write_bytes(result)
          for name,size,sha in assets:
              data=pathlib.Path(name).read_bytes();assert len(data)==size and hashlib.sha256(data).hexdigest()==sha
          manifest = {"versionCode":23,"versionName":"1.1.7","apkUrl":"https://cdn.jsdelivr.net/gh/28725535856/underwater-sensor-updates@main/packages/underwater-sensor-1.1.7.apk","apkBytes":5228724,"sha256":"2ba879e57b8dee0da73c8aab4a17ae42c8ab143219e08cfd5b064f3522b2ff91","notes":"启动确认超时或蓝牙连接中断时保留已采数据并自动重连。取消旧版采集点数和段数上限。图表恢复逐点换算及原版圆滑曲线，导出保留实际逐点换算值。153 项测试通过，手机长时间实测待验证。","deltas":[{"fromVersionCode":22,"baseSha256":"a438a46feb91d194f60ee7d027e12c3fcfe652fd55f6be0dcdf9df22f27c4e72","url":"https://cdn.jsdelivr.net/gh/28725535856/underwater-sensor-updates@main/packages/underwater-sensor-1.1.6-to-1.1.7.sud.gz","bytes":287865,"sha256":"332f0a525f3d198afb9d2970e86ae97baadad071a9a6214b42fc0494d0af6cb0"}]}
          content = (json.dumps(manifest, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
          pathlib.Path('latest.json').write_bytes(content)
          notes = "启动确认超时或蓝牙连接中断时保留已采数据并自动重连。取消旧版采集点数和段数上限。图表恢复逐点换算及原版圆滑曲线，导出保留实际逐点换算值。153 项测试通过，手机长时间实测待验证。"
          pathlib.Path('release-notes.md').write_text(notes, encoding='utf-8')
          existing = subprocess.run(['gh','release','view','v1.1.7','--repo',repo], capture_output=True)
          if existing.returncode != 0:
              subprocess.run(['gh','release','create','v1.1.7']+[a[0] for a in assets]+['latest.json',
                  '--repo',repo,'--target',os.environ['GITHUB_SHA'],'--latest',
                  '--title','水下传感器 1.1.7 · 长测自动恢复与逐点阻值','--notes-file','release-notes.md'], check=True)
          def put(path, data, immutable=False):
              endpoint = 'repos/' + repo + '/contents/' + path
              result = subprocess.run(['gh','api',endpoint], capture_output=True, text=True)
              previous = json.loads(result.stdout) if result.returncode == 0 else None
              blob = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if previous and previous['sha'] == blob:
                  print('Verified existing content:', path); return
              if immutable and previous:
                  raise RuntimeError('Immutable asset differs: '+path)
              payload = {'message':'Publish verified sensor 1.1.7: '+path,
                  'content':base64.b64encode(data).decode('ascii'), 'branch':'main'}
              if previous: payload['sha'] = previous['sha']
              temporary = pathlib.Path('contents-payload.json')
              temporary.write_text(json.dumps(payload), encoding='utf-8')
              response = subprocess.run(['gh','api','--method','PUT',endpoint,'--input',str(temporary)],
                  capture_output=True, text=True, check=True)
              assert json.loads(response.stdout)['content']['sha'] == blob
              temporary.unlink()
              print('Published:',path)
          # Versioned assets must exist before any phone is offered the new version.
          for name, size, sha in assets: put('packages/'+name, pathlib.Path(name).read_bytes(), True)
          put('updates/latest.json',content)
          put('latest.json',content)
          put('updates/latest-cdn.json',content)
          readme = "# 水下传感器更新\n\n当前版本 1.1.7（23）\n\n启动确认超时或蓝牙连接中断时保留已采数据并自动重连。取消旧版采集点数和段数上限。图表恢复逐点换算及原版圆滑曲线，导出保留实际逐点换算值。153 项测试通过，手机长时间实测待验证。\n\nCDN 清单：https://cdn.jsdelivr.net/gh/28725535856/underwater-sensor-updates@main/updates/latest-cdn.json\n"
          put('README.md',readme.encode('utf-8'))
          PY