name: Publish sensor 1.0.13 and direct delta update
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-1.0.13.yml'
permissions:
  contents: write
concurrency:
  group: publish-sensor-1.0.13
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify signed release files, mirror assets, then advance manifests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sensor-release-1.0.13"
          cd "$RUNNER_TEMP/sensor-release-1.0.13"
          python3 - <<'PY'
          import os, pathlib, hashlib, json, base64, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          stage = 'https://underwater-sensor-updates-20261104.z2656953367.chatgpt.site/releases/'
          direct = 'https://raw.githubusercontent.com/' + repo + '/main/'
          assets = [('underwater-sensor-1.0.13.apk',
            5234945,
            '47b79ebd5324a1f2df644f3d1b8b5574191c9a6e3074d02eb1af21dbd0d4e49f'),
           ('underwater-sensor-1.0.12-to-1.0.13.sud.gz',
            265122,
            'd25ac18508017a0aae34565231959937acee9c27b0ab96b4f9de3c411b0d73ce')]
          for name, size, sha in assets:
              subprocess.run(['curl', '--fail', '--location', '--silent', '--show-error',
                  '--proto', '=https', '--proto-redir', '=https', '--connect-timeout', '15',
                  '--max-time', '180', '--retry', '2', stage + name, '--output', name], check=True)
              data = pathlib.Path(name).read_bytes()
              assert len(data) == size and hashlib.sha256(data).hexdigest() == sha, 'Release asset verification failed'
              print('Verified release asset:', name, size)
          manifest = {'versionCode': 14,
           'versionName': '1.0.13',
           'apkUrl': 'https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/packages/underwater-sensor-1.0.13.apk',
           'apkBytes': 5234945,
           'sha256': '47b79ebd5324a1f2df644f3d1b8b5574191c9a6e3074d02eb1af21dbd0d4e49f',
           'notes': '修复完整空采样包NUM=0导致自动停止：空包不增加数据，自动延长等待继续采集。初始500ms，空包后1000ms、1500ms适应板端速度，成功后保留已适应等待；连续4轮无样本才停止。损坏或错轮次数据仍报错，已有采样保留。保留120万Ω上限、连续趋势曲线和Excel。',
           'deltas': [{'fromVersionCode': 13,
                       'baseSha256': '619aa559ce1ca36f3d3a8ca01ad73eeb52347d88fe6d478f08960afa5d875db2',
                       'url': 'https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/packages/underwater-sensor-1.0.12-to-1.0.13.sud.gz',
                       'bytes': 265122,
                       'sha256': 'd25ac18508017a0aae34565231959937acee9c27b0ab96b4f9de3c411b0d73ce'}]}
          content = (json.dumps(manifest, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
          pathlib.Path('latest.json').write_bytes(content)
          notes = '''水下传感器1.0.13（14），Android6及以上。
          修复完整空采样包NUM=0导致自动停止：空包不增加数据，自动延长等待继续采集。初始500ms，空包后1000ms、1500ms适应板端速度，成功后保留已适应等待；连续4轮无样本才停止。损坏或错轮次数据仍报错，已有采样保留。保留120万Ω上限、连续趋势曲线和Excel。
          86项关联测试通过，包含本次手机52字节空包、成功后空包、重试上限、错时间与坏帧、停止后迟到回复。签名与差异还原校验通过。
          空包不绘图、不计入采样、不导出虚构数据。等待适应后可能比250ms固定窗口慢，以板端可返回有效样本为准，不承诺实时流。
          安装后确认当前版本1.0.13（14），新开一轮检测验证空包后的恢复。
          仅公开APK、差异包及说明，无源码、签名私钥和测量数据。
          '''
          pathlib.Path('release-notes.md').write_text(notes, encoding='utf-8')
          existing = subprocess.run(['gh','release','view','v1.0.13','--repo',repo], capture_output=True)
          if existing.returncode != 0:
              subprocess.run(['gh','release','create','v1.0.13']+[a[0] for a in assets]+['latest.json',
                  '--repo',repo,'--target',os.environ['GITHUB_SHA'],'--latest',
                  '--title','水下传感器 1.0.13 · 空包恢复修复','--notes-file','release-notes.md'], check=True)
          def put(path, data, immutable=False):
              endpoint = 'repos/' + repo + '/contents/' + path
              result = subprocess.run(['gh','api',endpoint], capture_output=True, text=True)
              previous = json.loads(result.stdout) if result.returncode == 0 else None
              blob = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if previous and previous['sha'] == blob:
                  print('Verified existing content:', path); return
              if immutable and previous:
                  raise RuntimeError('Immutable asset differs: '+path)
              payload = {'message':'Publish verified sensor 1.0.13: '+path,
                  'content':base64.b64encode(data).decode('ascii'), 'branch':'main'}
              if previous: payload['sha'] = previous['sha']
              temporary = pathlib.Path('contents-payload.json')
              temporary.write_text(json.dumps(payload), encoding='utf-8')
              response = subprocess.run(['gh','api','--method','PUT',endpoint,'--input',str(temporary)],
                  capture_output=True, text=True, check=True)
              assert json.loads(response.stdout)['content']['sha'] == blob
              temporary.unlink()
              print('Published:',path)
          # Versioned assets must exist before any phone is offered the new version.
          for name, size, sha in assets: put('packages/'+name, pathlib.Path(name).read_bytes(), True)
          put('updates/latest.json',content)
          put('latest.json',content)
          readme = '''# 水下传感器应用更新
          
          当前版本1.0.13（14）。
          
          App清单：https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/updates/latest.json
          
          修复完整空采样包NUM=0导致自动停止：空包不增加数据，自动延长等待继续采集。初始500ms，空包后1000ms、1500ms适应板端速度，成功后保留已适应等待；连续4轮无样本才停止。损坏或错轮次数据仍报错，已有采样保留。保留120万Ω上限、连续趋势曲线和Excel。
          
          86项关联测试和原签名、差异还原校验通过，实际板端恢复效果待手机验证。
          '''
          put('README.md',readme.encode('utf-8'))
          PY




