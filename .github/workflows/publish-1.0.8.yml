name: Publish sensor 1.0.8 and direct delta update
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-1.0.8.yml'
permissions:
  contents: write
concurrency:
  group: publish-sensor-1.0.8
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify signed release files, mirror assets, then advance manifests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sensor-release-1.0.8"
          cd "$RUNNER_TEMP/sensor-release-1.0.8"
          python3 - <<'PY'
          import os, pathlib, hashlib, json, base64, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          stage = 'https://underwater-sensor-updates-20261104.z2656953367.chatgpt.site/releases/'
          direct = 'https://raw.githubusercontent.com/' + repo + '/main/'
          assets = [
              ('underwater-sensor-1.0.8.apk', 5222664, 'c3917059ff8f84694124782dfc587b3d01121481fd5823fb0e9b9ab1b0217015'),
              ('underwater-sensor-1.0.7-to-1.0.8.sud.gz', 272259, 'f27a379353012385e7158f21dd6fd042b5023aea3ffbc0f0fc8b9aa8946827f5'),
          ]
          for name, size, sha in assets:
              subprocess.run(['curl', '--fail', '--location', '--silent', '--show-error',
                  '--proto', '=https', '--proto-redir', '=https', '--connect-timeout', '15',
                  '--max-time', '180', '--retry', '2', stage + name, '--output', name], check=True)
              data = pathlib.Path(name).read_bytes()
              assert len(data) == size and hashlib.sha256(data).hexdigest() == sha, 'Release asset verification failed'
              print('Verified release asset:', name, size)
          manifest = {
              'versionCode': 9, 'versionName': '1.0.8',
              'apkUrl': direct + 'packages/underwater-sensor-1.0.8.apk',
              'apkBytes': 5222664,
              'sha256': assets[0][2],
              'notes': 'GATT读取通道诊断版：连接诊断→实时通道测试→GATT直接读取（30秒）。只发送一次原有启动指令，确认后串行标准读取FFE1，不发送3032。分别记录空值、启动确认、原始值变化及可识别完整数据帧；尚未确认实时采集和硬件停止能力。从1.0.7可优先使用约272KB差异包。',
              'deltas': [{
                  'fromVersionCode': 8,
                  'baseSha256': '0ef889da5b7e12e57f1671d98fc4ead7ee6c785021d709cdf4ecaba66e9154d9',
                  'url': direct + 'packages/underwater-sensor-1.0.7-to-1.0.8.sud.gz',
                  'bytes': 272259, 'sha256': assets[1][2],
              }],
          }
          content = (json.dumps(manifest, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
          pathlib.Path('latest.json').write_bytes(content)
          notes = '''水下传感器 1.0.8（9），Android 6 及以上。
          本版探索尚未验证的标准GATT读取通道，不宣称已实现连续实时采集。
          入口：连接诊断 → 实时通道测试 → GATT直接读取（30秒）。
          只发送一次现有3031启动指令，确认后标准读取FFE1，绝不发送3032或反复重启采样。
          串行读取，每次回调后至少间隔1秒，单次回调等待最多5秒，总测试30秒。
          区分空值、固定启动确认、原始值变化和可识别完整数据帧；未知字节不会换算成电阻。
          测试结束后复制连接诊断；诊断仅保存在本机，不自动上传。
          保留原60秒通知监听、普通检测、数据读取与Excel导出。
          从1.0.7（8）可优先下载272259字节差异包；基包不匹配时下载完整APK。
          差异包已用App同一Java实现验证可精确还原签名APK，手机端仍需实测。
          本仓库不包含客户端源码、签名私钥或测量数据。
          '''
          pathlib.Path('release-notes.md').write_text(notes, encoding='utf-8')
          existing = subprocess.run(['gh','release','view','v1.0.8','--repo',repo], capture_output=True)
          if existing.returncode != 0:
              subprocess.run(['gh','release','create','v1.0.8']+[a[0] for a in assets]+['latest.json',
                  '--repo',repo,'--target',os.environ['GITHUB_SHA'],'--latest',
                  '--title','水下传感器 1.0.8 · GATT读取通道诊断','--notes-file','release-notes.md'], check=True)
          def put(path, data, immutable=False):
              endpoint = 'repos/' + repo + '/contents/' + path
              result = subprocess.run(['gh','api',endpoint], capture_output=True, text=True)
              previous = json.loads(result.stdout) if result.returncode == 0 else None
              blob = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if previous and previous['sha'] == blob:
                  print('Verified existing content:', path); return
              if immutable and previous:
                  raise RuntimeError('Immutable asset differs: '+path)
              payload = {'message':'Publish verified sensor 1.0.8: '+path,
                  'content':base64.b64encode(data).decode('ascii'), 'branch':'main'}
              if previous: payload['sha'] = previous['sha']
              temporary = pathlib.Path('contents-payload.json')
              temporary.write_text(json.dumps(payload), encoding='utf-8')
              response = subprocess.run(['gh','api','--method','PUT',endpoint,'--input',str(temporary)],
                  capture_output=True, text=True, check=True)
              assert json.loads(response.stdout)['content']['sha'] == blob
              temporary.unlink()
              print('Published:',path)
          # Versioned assets must exist before any phone is offered the new version.
          for name, size, sha in assets: put('packages/'+name, pathlib.Path(name).read_bytes(), True)
          put('updates/latest.json',content)
          put('latest.json',content)
          readme = '''# 水下传感器应用更新
          
          当前版本：1.0.8（9），Android 6 及以上，GATT读取通道诊断版。
          
          App更新清单：https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/updates/latest.json
          
          从原1.0.7（8）可优先下载约272KB差异包；基包不匹配时下载完整APK。
          下载后仍需点击安装更新，并完成Android系统确认。
          
          ## GATT读取通道测试
          
          连接诊断 → 实时通道测试 → GATT直接读取（30秒）。
          保持App前台等待30秒，结束后再次打开连接诊断并复制结果。
          测试只发送一次原启动指令，确认后标准读取FFE1，不发送3032，不反复启动采样。
          区分空值、固定启动确认、原始值变化和可识别完整数据帧。
          不把未知原始值猜成电阻，也不拼接重复属性读取来伪造新样本。
          尚未确认实时采集和硬件停止能力。结束接收只结束客户端监听，不代表硬件已停止采样。
          原60秒通知监听测试保留在同一测试菜单内。
          
          此仓库仅发布安装包、差异包和更新信息，不包含客户端源码、签名私钥或测量数据。
          '''
          put('README.md',readme.encode('utf-8'))
          PY

