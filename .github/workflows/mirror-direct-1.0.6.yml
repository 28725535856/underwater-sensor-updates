name: Mirror signed APK for direct download
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mirror-direct-1.0.6.yml'
permissions:
  contents: write
concurrency:
  group: mirror-direct-1.0.6
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify release APK and add its immutable direct-download copy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/direct-apk"
          cd "$RUNNER_TEMP/direct-apk"
          gh release download v1.0.6 --repo "$GITHUB_REPOSITORY" --pattern underwater-sensor-1.0.6.apk
          python3 - <<'PY'
          import os, pathlib, hashlib, json, base64, subprocess
          apk=pathlib.Path('underwater-sensor-1.0.6.apk'); data=apk.read_bytes()
          assert len(data)==5218566
          assert hashlib.sha256(data).hexdigest()=='5e4d34875af80b9582399674e0dd33eb506a6580de9282197252f27343472ddb'
          endpoint='repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/packages/underwater-sensor-1.0.6.apk'
          blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          existing=subprocess.run(['gh','api',endpoint,'--jq','.sha'],capture_output=True,text=True)
          if existing.returncode==0:
              assert existing.stdout.strip()==blob, 'Existing immutable APK copy differs'
              print('Verified existing APK mirror'); raise SystemExit(0)
          payload={'message':'Add verified direct-download APK 1.0.6','content':base64.b64encode(data).decode('ascii'),'branch':'main'}
          p=pathlib.Path('upload.json'); p.write_text(json.dumps(payload))
          result=subprocess.run(['gh','api','--method','PUT',endpoint,'--input',str(p)],capture_output=True,text=True,check=True)
          response=json.loads(result.stdout)
          assert response['content']['sha']==blob
          print('Verified APK mirror committed:',response['commit']['sha'])
          PY
