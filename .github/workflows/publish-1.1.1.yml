name: Publish sensor 1.1.1 and direct delta update
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-1.1.1.yml'
permissions:
  contents: write
concurrency:
  group: publish-sensor-1.1.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify signed release files, mirror assets, then advance manifests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sensor-release-1.1.1"
          cd "$RUNNER_TEMP/sensor-release-1.1.1"
          python3 - <<'PY'
          import os, pathlib, hashlib, json, base64, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          stage = 'https://underwater-sensor-updates-20261104.z2656953367.chatgpt.site/releases/'
          direct = 'https://raw.githubusercontent.com/' + repo + '/main/'
          assets = [('underwater-sensor-1.1.1.apk', 5221345, '76a44c37153723d55af3911c710693b68921a9aa18916dc263357fc0f0ad4026'), ('underwater-sensor-1.0.13-to-1.1.1.sud.gz', 280427, 'd9cecd128356a46b7efaad73147fd9052ced3b050214a7df6734adc5ca71456f'), ('underwater-sensor-1.0.14-to-1.1.1.sud.gz', 281176, '75e554f660ffd958fee50fceade26b076adbb988006f65e1bdde7f68ebea03ea'), ('underwater-sensor-1.1.0-to-1.1.1.sud.gz', 243806, 'a85756d59ebdec776afc33948f3d05531de21a2ca77f4645c77950598ba00c99')]
          for name, size, sha in assets:
              subprocess.run(['curl', '--fail', '--location', '--silent', '--show-error',
                  '--proto', '=https', '--proto-redir', '=https', '--connect-timeout', '15',
                  '--max-time', '180', '--retry', '2', stage + name, '--output', name], check=True)
              data = pathlib.Path(name).read_bytes()
              assert len(data) == size and hashlib.sha256(data).hexdigest() == sha, 'Release asset verification failed'
              print('Verified release asset:', name, size)
          manifest = {'versionCode': 17, 'versionName': '1.1.1', 'apkUrl': 'https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/packages/underwater-sensor-1.1.1.apk', 'apkBytes': 5221345, 'sha256': '76a44c37153723d55af3911c710693b68921a9aa18916dc263357fc0f0ad4026', 'notes': '无需烧录，恢复自动采集并改为FIFO逐点显示：收到一批真实数据先入队，按原固件约500ms采样间隔逐点刷新数值和曲线。显示缓存点数；队列空时等待，不补点。取消批间额外等待，避免过早读取空包；停止时发送原读取指令并保留记录，导出包含尚未显示的已采集点。保留蓝牙兼容、120万Ω显示和ADC255超量程。此版本是缓存逐点展示，原固件仍分批回传，不能消除采集与传输延迟。', 'deltas': [{'fromVersionCode': 14, 'baseSha256': '47b79ebd5324a1f2df644f3d1b8b5574191c9a6e3074d02eb1af21dbd0d4e49f', 'url': 'https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/packages/underwater-sensor-1.0.13-to-1.1.1.sud.gz', 'bytes': 280427, 'sha256': 'd9cecd128356a46b7efaad73147fd9052ced3b050214a7df6734adc5ca71456f'}, {'fromVersionCode': 15, 'baseSha256': '2d68fb03e5afb2e3d0fc63e6d4fc443f9934429693e54d32fc7201852bf7f0c0', 'url': 'https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/packages/underwater-sensor-1.0.14-to-1.1.1.sud.gz', 'bytes': 281176, 'sha256': '75e554f660ffd958fee50fceade26b076adbb988006f65e1bdde7f68ebea03ea'}, {'fromVersionCode': 16, 'baseSha256': 'f0fad97f9f0343b7a1572dad039bf6e4807712cd59d1195c4b2e17d0d4063ef5', 'url': 'https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/packages/underwater-sensor-1.1.0-to-1.1.1.sud.gz', 'bytes': 243806, 'sha256': 'a85756d59ebdec776afc33948f3d05531de21a2ca77f4645c77950598ba00c99'}]}
          content = (json.dumps(manifest, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
          pathlib.Path('latest.json').write_bytes(content)
          notes = '水下传感器1.1.1（17），Android6及以上，无需烧录。\n无需烧录，恢复自动采集并改为FIFO逐点显示：收到一批真实数据先入队，按原固件约500ms采样间隔逐点刷新数值和曲线。显示缓存点数；队列空时等待，不补点。取消批间额外等待，避免过早读取空包；停止时发送原读取指令并保留记录，导出包含尚未显示的已采集点。保留蓝牙兼容、120万Ω显示和ADC255超量程。此版本是缓存逐点展示，原固件仍分批回传，不能消除采集与传输延迟。\n115项测试、Java精确增量还原、原签名及对齐校验通过；手机表现待实测。\n仅公开APK、增量及说明，无源码、私钥或测量数据。'
          pathlib.Path('release-notes.md').write_text(notes, encoding='utf-8')
          existing = subprocess.run(['gh','release','view','v1.1.1','--repo',repo], capture_output=True)
          if existing.returncode != 0:
              subprocess.run(['gh','release','create','v1.1.1']+[a[0] for a in assets]+['latest.json',
                  '--repo',repo,'--target',os.environ['GITHUB_SHA'],'--latest',
                  '--title','水下传感器 1.1.1 · FIFO逐点显示，无需烧录','--notes-file','release-notes.md'], check=True)
          def put(path, data, immutable=False):
              endpoint = 'repos/' + repo + '/contents/' + path
              result = subprocess.run(['gh','api',endpoint], capture_output=True, text=True)
              previous = json.loads(result.stdout) if result.returncode == 0 else None
              blob = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if previous and previous['sha'] == blob:
                  print('Verified existing content:', path); return
              if immutable and previous:
                  raise RuntimeError('Immutable asset differs: '+path)
              payload = {'message':'Publish verified sensor 1.1.1: '+path,
                  'content':base64.b64encode(data).decode('ascii'), 'branch':'main'}
              if previous: payload['sha'] = previous['sha']
              temporary = pathlib.Path('contents-payload.json')
              temporary.write_text(json.dumps(payload), encoding='utf-8')
              response = subprocess.run(['gh','api','--method','PUT',endpoint,'--input',str(temporary)],
                  capture_output=True, text=True, check=True)
              assert json.loads(response.stdout)['content']['sha'] == blob
              temporary.unlink()
              print('Published:',path)
          # Versioned assets must exist before any phone is offered the new version.
          for name, size, sha in assets: put('packages/'+name, pathlib.Path(name).read_bytes(), True)
          put('updates/latest.json',content)
          put('latest.json',content)
          readme = '# 水下传感器应用更新\n\n当前版本1.1.1（17），无需烧录。\n\n更新清单：https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/updates/latest.json\n\n无需烧录，恢复自动采集并改为FIFO逐点显示：收到一批真实数据先入队，按原固件约500ms采样间隔逐点刷新数值和曲线。显示缓存点数；队列空时等待，不补点。取消批间额外等待，避免过早读取空包；停止时发送原读取指令并保留记录，导出包含尚未显示的已采集点。保留蓝牙兼容、120万Ω显示和ADC255超量程。此版本是缓存逐点展示，原固件仍分批回传，不能消除采集与传输延迟。\n\n测试及签名、增量还原通过，手机效果待实测。\n'
          put('README.md',readme.encode('utf-8'))
          PY




