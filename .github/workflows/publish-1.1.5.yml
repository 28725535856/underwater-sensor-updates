name: Publish sensor 1.1.5 and direct delta update
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-1.1.5.yml'
permissions:
  contents: write
concurrency:
  group: publish-sensor-1.1.5
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify signed release files, mirror assets, then advance manifests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sensor-release-1.1.5"
          cd "$RUNNER_TEMP/sensor-release-1.1.5"
          python3 - <<'PY'
          import os, pathlib, hashlib, json, base64, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          stage = 'https://underwater-sensor-updates-20261104.z2656953367.chatgpt.site/releases/'
          direct = 'https://raw.githubusercontent.com/' + repo + '/main/'
          assets = [('underwater-sensor-1.1.5.apk', 5225441, 'cb3c08ffedecea18a869fb7150c2b99965e77f824b860c7d1a4b94cbab4fa79d'), ('underwater-sensor-1.1.4-to-1.1.5.sud.gz', 285484, '760d1ca141b986d9344517485948be64cf393dab60139cf828dd18375a4ef46e')]
          import gzip, struct, io
          def download(url, dest):
              subprocess.run(['curl','--fail','--location','--silent','--show-error','--retry','2','--max-time','180',url,'--output',dest],check=True)
          download(direct+'packages/underwater-sensor-1.1.4.apk','base.apk')
          download(direct+'packages/underwater-sensor-1.1.4-to-1.1.5.sud.gz','underwater-sensor-1.1.4-to-1.1.5.sud.gz')
          old=pathlib.Path('base.apk').read_bytes()
          stream=io.BytesIO(gzip.decompress(pathlib.Path('underwater-sensor-1.1.4-to-1.1.5.sud.gz').read_bytes()))
          magic,oldsize,newsize=struct.unpack('>Iqq',stream.read(20));oldhash,newhash=stream.read(32),stream.read(32)
          assert magic==0x53554431 and oldsize==len(old) and hashlib.sha256(old).digest()==oldhash and newsize<128*1024*1024
          result=bytearray()
          while True:
              op=stream.read(1)
              if op==b'\x7f':break
              if op==b'\0':
                  pos,n=struct.unpack('>qI',stream.read(12));assert pos>=0 and pos+n<=len(old);result+=old[pos:pos+n]
              else:
                  assert op==b'\1';n=struct.unpack('>I',stream.read(4))[0];result+=stream.read(n)
              assert len(result)<=newsize
          assert len(result)==newsize and hashlib.sha256(result).digest()==newhash
          pathlib.Path('underwater-sensor-1.1.5.apk').write_bytes(result)
          for name,size,sha in assets:
              data=pathlib.Path(name).read_bytes();assert len(data)==size and hashlib.sha256(data).hexdigest()==sha
          manifest = {'versionCode': 21, 'versionName': '1.1.5', 'apkUrl': 'https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/packages/underwater-sensor-1.1.5.apk', 'apkBytes': 5225441, 'sha256': 'cb3c08ffedecea18a869fb7150c2b99965e77f824b860c7d1a4b94cbab4fa79d', 'notes': '无需拆板或烧录。按要求，界面、复制和Excel统一显示阻值：最近1～4个有效ADC取均值后按4700*m/(255-m)换算；采集信息页记录处理方法。超过750ms间隙、超量程会重置窗口，不补造时间点。新增残包1500ms未补齐时有限次重读同一缓存（最多2次），不重启采样。147项测试、签名与实际Java增量还原通过；手机待验证。该处理没有改变8位ADC硬件分辨率。', 'deltas': [{'fromVersionCode': 20, 'baseSha256': '745ea8bbe7c18a5cbcaeae5641fa9bbfca7dfcd3bee674604da5e36ec3d8952a', 'url': 'https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/packages/underwater-sensor-1.1.4-to-1.1.5.sud.gz', 'bytes': 285484, 'sha256': '760d1ca141b986d9344517485948be64cf393dab60139cf828dd18375a4ef46e'}]}
          content = (json.dumps(manifest, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
          pathlib.Path('latest.json').write_bytes(content)
          notes = '无需拆板或烧录。按要求，界面、复制和Excel统一显示阻值：最近1～4个有效ADC取均值后按4700*m/(255-m)换算；采集信息页记录处理方法。超过750ms间隙、超量程会重置窗口，不补造时间点。新增残包1500ms未补齐时有限次重读同一缓存（最多2次），不重启采样。147项测试、签名与实际Java增量还原通过；手机待验证。该处理没有改变8位ADC硬件分辨率。'
          pathlib.Path('release-notes.md').write_text(notes, encoding='utf-8')
          existing = subprocess.run(['gh','release','view','v1.1.5','--repo',repo], capture_output=True)
          if existing.returncode != 0:
              subprocess.run(['gh','release','create','v1.1.5']+[a[0] for a in assets]+['latest.json',
                  '--repo',repo,'--target',os.environ['GITHUB_SHA'],'--latest',
                  '--title','水下传感器1.1.5 · 四点换算与残包重读','--notes-file','release-notes.md'], check=True)
          def put(path, data, immutable=False):
              endpoint = 'repos/' + repo + '/contents/' + path
              result = subprocess.run(['gh','api',endpoint], capture_output=True, text=True)
              previous = json.loads(result.stdout) if result.returncode == 0 else None
              blob = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if previous and previous['sha'] == blob:
                  print('Verified existing content:', path); return
              if immutable and previous:
                  raise RuntimeError('Immutable asset differs: '+path)
              payload = {'message':'Publish verified sensor 1.1.5: '+path,
                  'content':base64.b64encode(data).decode('ascii'), 'branch':'main'}
              if previous: payload['sha'] = previous['sha']
              temporary = pathlib.Path('contents-payload.json')
              temporary.write_text(json.dumps(payload), encoding='utf-8')
              response = subprocess.run(['gh','api','--method','PUT',endpoint,'--input',str(temporary)],
                  capture_output=True, text=True, check=True)
              assert json.loads(response.stdout)['content']['sha'] == blob
              temporary.unlink()
              print('Published:',path)
          # Versioned assets must exist before any phone is offered the new version.
          for name, size, sha in assets: put('packages/'+name, pathlib.Path(name).read_bytes(), True)
          put('updates/latest.json',content)
          put('latest.json',content)
          readme = '# 水下传感器更新\n\n当前版本1.1.5（21）\n\n无需拆板或烧录。按要求，界面、复制和Excel统一显示阻值：最近1～4个有效ADC取均值后按4700*m/(255-m)换算；采集信息页记录处理方法。超过750ms间隙、超量程会重置窗口，不补造时间点。新增残包1500ms未补齐时有限次重读同一缓存（最多2次），不重启采样。147项测试、签名与实际Java增量还原通过；手机待验证。该处理没有改变8位ADC硬件分辨率。\n\n清单：https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/updates/latest.json\n'
          put('README.md',readme.encode('utf-8'))
          PY




