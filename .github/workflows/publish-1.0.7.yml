name: Publish sensor 1.0.7 and direct delta update
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-1.0.7.yml'
permissions:
  contents: write
concurrency:
  group: publish-sensor-1.0.7
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify signed release files, mirror assets, then advance manifests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sensor-release-1.0.7"
          cd "$RUNNER_TEMP/sensor-release-1.0.7"
          python3 - <<'PY'
          import os, pathlib, hashlib, json, base64, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          stage = 'https://underwater-sensor-updates-20261104.z2656953367.chatgpt.site/releases/'
          direct = 'https://raw.githubusercontent.com/' + repo + '/main/'
          assets = [
              ('underwater-sensor-1.0.7.apk', 5218566, '0ef889da5b7e12e57f1671d98fc4ead7ee6c785021d709cdf4ecaba66e9154d9'),
              ('underwater-sensor-1.0.6-to-1.0.7.sud.gz', 225220, '72f49142e900d344d1050fcadbc07ed2d637fae1536db354d10af4bae5259af2'),
          ]
          for name, size, sha in assets:
              subprocess.run(['curl', '--fail', '--location', '--silent', '--show-error',
                  '--proto', '=https', '--proto-redir', '=https', '--connect-timeout', '15',
                  '--max-time', '180', '--retry', '2', stage + name, '--output', name], check=True)
              data = pathlib.Path(name).read_bytes()
              assert len(data) == size and hashlib.sha256(data).hexdigest() == sha, 'Release asset verification failed'
              print('Verified release asset:', name, size)
          manifest = {
              'versionCode': 8, 'versionName': '1.0.7',
              'apkUrl': direct + 'packages/underwater-sensor-1.0.7.apk',
              'apkBytes': 5218566,
              'sha256': assets[0][2],
              'notes': '实时通道诊断版：连接诊断中新增保持连接测试。只发送现有启动指令，确认后监听60秒；有效主动数据帧可显示，重复帧单独统计。未确认硬件停止指令。保留普通检测、读取和Excel导出。从1.0.6可优先下载约225KB差异包，需完成系统安装确认。',
              'deltas': [{
                  'fromVersionCode': 7,
                  'baseSha256': '5e4d34875af80b9582399674e0dd33eb506a6580de9282197252f27343472ddb',
                  'url': direct + 'packages/underwater-sensor-1.0.6-to-1.0.7.sud.gz',
                  'bytes': 225220, 'sha256': assets[1][2],
              }],
          }
          content = (json.dumps(manifest, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
          pathlib.Path('latest.json').write_bytes(content)
          notes = '''水下传感器 1.0.7（8），Android 6 及以上。
          本版为实时通道诊断版，尚未确认硬件停止采样指令。
          测试入口：连接诊断 → 保持连接测试；等待60秒后复制诊断。
          测试只发送原有启动指令，不自动读取或重启采样；保持连接接收后续通知。
          有效主动数据帧可显示最近一帧；不会把重复旧帧补成连续新样本。
          从原1.0.6（7）可优先使用225220字节差异包；基包不匹配时下载完整APK。
          差异包已在电脑用同一Java实现验证可准确重建签名APK，手机首次增量更新仍需实测。
          本仓库仅发布安装包、差异包及更新信息，不包含客户端源码、签名私钥或测量数据。
          '''
          pathlib.Path('release-notes.md').write_text(notes, encoding='utf-8')
          existing = subprocess.run(['gh','release','view','v1.0.7','--repo',repo], capture_output=True)
          if existing.returncode != 0:
              subprocess.run(['gh','release','create','v1.0.7']+[a[0] for a in assets]+['latest.json',
                  '--repo',repo,'--target',os.environ['GITHUB_SHA'],'--latest',
                  '--title','水下传感器 1.0.7 · 实时通道诊断','--notes-file','release-notes.md'], check=True)
          def put(path, data, immutable=False):
              endpoint = 'repos/' + repo + '/contents/' + path
              result = subprocess.run(['gh','api',endpoint], capture_output=True, text=True)
              previous = json.loads(result.stdout) if result.returncode == 0 else None
              blob = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if previous and previous['sha'] == blob:
                  print('Verified existing content:', path); return
              if immutable and previous:
                  raise RuntimeError('Immutable asset differs: '+path)
              payload = {'message':'Publish verified sensor 1.0.7: '+path,
                  'content':base64.b64encode(data).decode('ascii'), 'branch':'main'}
              if previous: payload['sha'] = previous['sha']
              temporary = pathlib.Path('contents-payload.json')
              temporary.write_text(json.dumps(payload), encoding='utf-8')
              response = subprocess.run(['gh','api','--method','PUT',endpoint,'--input',str(temporary)],
                  capture_output=True, text=True, check=True)
              assert json.loads(response.stdout)['content']['sha'] == blob
              temporary.unlink()
              print('Published:',path)
          # Versioned assets must exist before any phone is offered the new version.
          for name, size, sha in assets: put('packages/'+name, pathlib.Path(name).read_bytes(), True)
          put('updates/latest.json',content)
          put('latest.json',content)
          readme = '''# 水下传感器应用更新
          
          当前版本：1.0.7（8），Android 6 及以上，实时通道诊断版。
          
          App 更新清单：https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/updates/latest.json
          
          从原1.0.6（7）可优先下载约225KB差异包；基包不匹配时下载完整APK。
          下载后仍需点击安装更新，并完成Android系统确认。
          
          ## 保持连接测试
          
          进入“连接诊断”，点击“保持连接测试”，保持App前台等待60秒。
          本测试只发送现有启动命令，确认后继续监听传感器通知；不自动反复启动或发送读取命令。
          有效主动数据帧可显示最近一帧，重复帧单独计数；尚未确认硬件停止指令。
          “结束接收”只结束客户端监听，不代表硬件已停止采样。
          测试结束后复制连接诊断用于联调，诊断不会自动上传。
          
          此仓库仅发布安装包、差异包和更新信息，不包含客户端源码、签名私钥或测量数据。
          '''
          put('README.md',readme.encode('utf-8'))
          PY
