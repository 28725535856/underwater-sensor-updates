name: Publish sensor 1.1.3 and direct delta update
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-1.1.3.yml'
permissions:
  contents: write
concurrency:
  group: publish-sensor-1.1.3
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify signed release files, mirror assets, then advance manifests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sensor-release-1.1.3"
          cd "$RUNNER_TEMP/sensor-release-1.1.3"
          python3 - <<'PY'
          import os, pathlib, hashlib, json, base64, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          stage = 'https://underwater-sensor-updates-20261104.z2656953367.chatgpt.site/releases/'
          direct = 'https://raw.githubusercontent.com/' + repo + '/main/'
          assets = [('underwater-sensor-1.1.3.apk', 5225441, 'f0c9500ca9f60d4afba258814c57457e7549259f60c33586f2d9f848c309bd44'), ('underwater-sensor-1.1.2-to-1.1.3.sud.gz', 283361, '053712a67e9a5f96b049dad37ad2a953a33e327d8243625fb2df6ef5e7db7345'), ('underwater-sensor-1.1.1-to-1.1.3.sud.gz', 283274, '61cb9f81f2e3acae953ee26c9599844a70f3d87a85bc15faa6c3bca1d7cf238a'), ('underwater-sensor-1.0.14-to-1.1.3.sud.gz', 283643, '4fe8ce223f199530e84f2a6557dbf92d6566a6791e119113d569fd6718038249')]
          for name, size, sha in assets:
              subprocess.run(['curl', '--fail', '--location', '--silent', '--show-error',
                  '--proto', '=https', '--proto-redir', '=https', '--connect-timeout', '15',
                  '--max-time', '180', '--retry', '2', stage + name, '--output', name], check=True)
              data = pathlib.Path(name).read_bytes()
              assert len(data) == size and hashlib.sha256(data).hexdigest() == sha, 'Release asset verification failed'
              print('Verified release asset:', name, size)
          manifest = {'versionCode': 19, 'versionName': '1.1.3', 'apkUrl': 'https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/packages/underwater-sensor-1.1.3.apk', 'apkBytes': 5225441, 'sha256': 'f0c9500ca9f60d4afba258814c57457e7549259f60c33586f2d9f848c309bd44', 'notes': '无需烧录。预缓存3个真实点后固定650ms逐点显示；全部采样点保留，批量到达时允许缓存超过3点。固定底部状态区高度，避免文字换行带动整页上下跳动；纵轴按档扩展且一次检测中不缩小。新增屏幕当前ADC与最新接收ADC对照诊断。沿用原版4700Ω换算参数，不强制把电阻改成70000Ω。原板仍批量回传，缓存用尽时需等待；手机效果待复测。', 'deltas': [{'fromVersionCode': 18, 'baseSha256': '7df1fb93c10340d65d6d37e8707752ec500a41e369d6a76bfb59f68165313b89', 'url': 'https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/packages/underwater-sensor-1.1.2-to-1.1.3.sud.gz', 'bytes': 283361, 'sha256': '053712a67e9a5f96b049dad37ad2a953a33e327d8243625fb2df6ef5e7db7345'}, {'fromVersionCode': 17, 'baseSha256': '76a44c37153723d55af3911c710693b68921a9aa18916dc263357fc0f0ad4026', 'url': 'https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/packages/underwater-sensor-1.1.1-to-1.1.3.sud.gz', 'bytes': 283274, 'sha256': '61cb9f81f2e3acae953ee26c9599844a70f3d87a85bc15faa6c3bca1d7cf238a'}, {'fromVersionCode': 15, 'baseSha256': '2d68fb03e5afb2e3d0fc63e6d4fc443f9934429693e54d32fc7201852bf7f0c0', 'url': 'https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/packages/underwater-sensor-1.0.14-to-1.1.3.sud.gz', 'bytes': 283643, 'sha256': '4fe8ce223f199530e84f2a6557dbf92d6566a6791e119113d569fd6718038249'}]}
          content = (json.dumps(manifest, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
          pathlib.Path('latest.json').write_bytes(content)
          notes = '水下传感器1.1.3（19），Android6及以上。\n无需烧录。预缓存3个真实点后固定650ms逐点显示；全部采样点保留，批量到达时允许缓存超过3点。固定底部状态区高度，避免文字换行带动整页上下跳动；纵轴按档扩展且一次检测中不缩小。新增屏幕当前ADC与最新接收ADC对照诊断。沿用原版4700Ω换算参数，不强制把电阻改成70000Ω。原板仍批量回传，缓存用尽时需等待；手机效果待复测。\n134项测试、三个实际Java增量还原、签名及对齐通过。手机效果待复测。\n仅公开APK、差异包及说明，不公开源码、签名私钥或测量数据。'
          pathlib.Path('release-notes.md').write_text(notes, encoding='utf-8')
          existing = subprocess.run(['gh','release','view','v1.1.3','--repo',repo], capture_output=True)
          if existing.returncode != 0:
              subprocess.run(['gh','release','create','v1.1.3']+[a[0] for a in assets]+['latest.json',
                  '--repo',repo,'--target',os.environ['GITHUB_SHA'],'--latest',
                  '--title','水下传感器 1.1.3 · 小缓存与显示稳定性修复','--notes-file','release-notes.md'], check=True)
          def put(path, data, immutable=False):
              endpoint = 'repos/' + repo + '/contents/' + path
              result = subprocess.run(['gh','api',endpoint], capture_output=True, text=True)
              previous = json.loads(result.stdout) if result.returncode == 0 else None
              blob = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if previous and previous['sha'] == blob:
                  print('Verified existing content:', path); return
              if immutable and previous:
                  raise RuntimeError('Immutable asset differs: '+path)
              payload = {'message':'Publish verified sensor 1.1.3: '+path,
                  'content':base64.b64encode(data).decode('ascii'), 'branch':'main'}
              if previous: payload['sha'] = previous['sha']
              temporary = pathlib.Path('contents-payload.json')
              temporary.write_text(json.dumps(payload), encoding='utf-8')
              response = subprocess.run(['gh','api','--method','PUT',endpoint,'--input',str(temporary)],
                  capture_output=True, text=True, check=True)
              assert json.loads(response.stdout)['content']['sha'] == blob
              temporary.unlink()
              print('Published:',path)
          # Versioned assets must exist before any phone is offered the new version.
          for name, size, sha in assets: put('packages/'+name, pathlib.Path(name).read_bytes(), True)
          put('updates/latest.json',content)
          put('latest.json',content)
          readme = '# 水下传感器应用更新\n\n当前版本1.1.3（19），无需烧录。\n\n清单：https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/updates/latest.json\n\n无需烧录。预缓存3个真实点后固定650ms逐点显示；全部采样点保留，批量到达时允许缓存超过3点。固定底部状态区高度，避免文字换行带动整页上下跳动；纵轴按档扩展且一次检测中不缩小。新增屏幕当前ADC与最新接收ADC对照诊断。沿用原版4700Ω换算参数，不强制把电阻改成70000Ω。原板仍批量回传，缓存用尽时需等待；手机效果待复测。\n\n134项测试及构建校验通过，手机表现待复测。\n'
          put('README.md',readme.encode('utf-8'))
          PY




