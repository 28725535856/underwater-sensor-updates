name: Publish sensor 1.0.11 and direct delta update
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-1.0.11.yml'
permissions:
  contents: write
concurrency:
  group: publish-sensor-1.0.11
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify signed release files, mirror assets, then advance manifests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sensor-release-1.0.11"
          cd "$RUNNER_TEMP/sensor-release-1.0.11"
          python3 - <<'PY'
          import os, pathlib, hashlib, json, base64, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          stage = 'https://underwater-sensor-updates-20261104.z2656953367.chatgpt.site/releases/'
          direct = 'https://raw.githubusercontent.com/' + repo + '/main/'
          assets = [
              ('underwater-sensor-1.0.11.apk', 5234945, 'e64bd5882f2bbf064af2ff3183432bf4af006c260f3e33fc47c11611370af67e'),
              ('underwater-sensor-1.0.10-to-1.0.11.sud.gz', 262960, 'f7cb1a7b46baa4c20c3ec694e0b0aa2e2e6aca4c4d23284abed154d2251aa229'),
              ('underwater-sensor-1.0.9-to-1.0.11.sud.gz', 281210, '77e101ad221bb7f007c8863ec3ddb960710110d418f320ea76d76d11cee9a7a4'),
          ]
          for name, size, sha in assets:
              subprocess.run(['curl', '--fail', '--location', '--silent', '--show-error',
                  '--proto', '=https', '--proto-redir', '=https', '--connect-timeout', '15',
                  '--max-time', '180', '--retry', '2', stage + name, '--output', name], check=True)
              data = pathlib.Path(name).read_bytes()
              assert len(data) == size and hashlib.sha256(data).hexdigest() == sha, 'Release asset verification failed'
              print('Verified release asset:', name, size)
          manifest = {
              'versionCode': 12, 'versionName': '1.0.11',
              'apkUrl': direct + 'packages/underwater-sensor-1.0.11.apk',
              'apkBytes': 5234945,
              'sha256': assets[0][2],
              'notes': '曲线改为按实际时间连接真实采样点，跨采集段连续连线，连线仅表示趋势，不新增采样点。保留1.2MΩ软件显示上限和ADC255超量程标识。采集、实际时间和Excel数据不变。支持从1.0.9或1.0.10通过差异包直接升级。完成系统安装后确认当前版本1.0.11（12），重新开始一轮检测。',
              'deltas': [{
                  'fromVersionCode': 11,
                  'baseSha256': 'cb0700924f9c7d52747b0b53ad8e13db709a1ce95a05c35ecc4961db1d04666b',
                  'url': direct + 'packages/underwater-sensor-1.0.10-to-1.0.11.sud.gz',
                  'bytes': 262960, 'sha256': assets[1][2],
              }, {
                  'fromVersionCode': 10,
                  'baseSha256': '1eee1aa777fbf2339547bab256a34ea349391b7401c9e9628fd40dd1b764f833',
                  'url': direct + 'packages/underwater-sensor-1.0.9-to-1.0.11.sud.gz',
                  'bytes': 281210, 'sha256': assets[2][2],
              }],
          }
          content = (json.dumps(manifest, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
          pathlib.Path('latest.json').write_bytes(content)
          notes = '''水下传感器1.0.11（12），Android6及以上。
          曲线按实际时间顺序连接真实采样点，跨段连续连线；段间连线只表示趋势，采集间隙和真实时间仍保留。
          继承1.0.10的1.2MΩ软件显示上限。有效ADC对应的70kΩ等高阻值正常显示；ADC255仍明确超量程。
          本次仅修改曲线显示和版本号。采样、蓝牙流程、原始ADC、导出数据均不变，不补点。
          Java编译、D8、ZIP完整性、原签名和zipalign通过；两种差异包均经App同一Java实现准确还原。
          上版本79项关联测试结果适用于未改动的采样/换算/导出路径，本次未为仅显示改动重复运行。手机连续曲线效果待实测。
          从1.0.9（10）升级差异包281210字节；从1.0.10（11）升级差异包262960字节。
          完成系统安装后，在检查更新中确认当前版本1.0.11（12），重新开始一轮检测。
          本仓库仅发布APK、差异包及更新说明，不包含源码、签名私钥或测量数据。
          '''
          pathlib.Path('release-notes.md').write_text(notes, encoding='utf-8')
          existing = subprocess.run(['gh','release','view','v1.0.11','--repo',repo], capture_output=True)
          if existing.returncode != 0:
              subprocess.run(['gh','release','create','v1.0.11']+[a[0] for a in assets]+['latest.json',
                  '--repo',repo,'--target',os.environ['GITHUB_SHA'],'--latest',
                  '--title','水下传感器 1.0.11 · 连续电阻曲线','--notes-file','release-notes.md'], check=True)
          def put(path, data, immutable=False):
              endpoint = 'repos/' + repo + '/contents/' + path
              result = subprocess.run(['gh','api',endpoint], capture_output=True, text=True)
              previous = json.loads(result.stdout) if result.returncode == 0 else None
              blob = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if previous and previous['sha'] == blob:
                  print('Verified existing content:', path); return
              if immutable and previous:
                  raise RuntimeError('Immutable asset differs: '+path)
              payload = {'message':'Publish verified sensor 1.0.11: '+path,
                  'content':base64.b64encode(data).decode('ascii'), 'branch':'main'}
              if previous: payload['sha'] = previous['sha']
              temporary = pathlib.Path('contents-payload.json')
              temporary.write_text(json.dumps(payload), encoding='utf-8')
              response = subprocess.run(['gh','api','--method','PUT',endpoint,'--input',str(temporary)],
                  capture_output=True, text=True, check=True)
              assert json.loads(response.stdout)['content']['sha'] == blob
              temporary.unlink()
              print('Published:',path)
          # Versioned assets must exist before any phone is offered the new version.
          for name, size, sha in assets: put('packages/'+name, pathlib.Path(name).read_bytes(), True)
          put('updates/latest.json',content)
          put('latest.json',content)
          readme = '''# 水下传感器应用更新
          
          当前版本：1.0.11（12），Android6及以上。
          
          App更新清单：https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/updates/latest.json
          
          曲线按实际时间连续连接真实采样点。段间连线表示趋势，采集间隙未消失，Excel不新增数据。
          
          软件显示上限1.2MΩ；ADC255标为超量程。70kΩ等高阻值在原始ADC有效时正常显示。
          
          开始后自动短时采集与读取，红色停止结束App循环；停止后查看记录和导出Excel。检测时保持前台。
          
          从1.0.9或1.0.10可直接差异升级，下载后完成系统安装确认，并核对当前版本1.0.11（12）。
          
          本仓库只发布APK、差异包和版本说明。
          '''
          put('README.md',readme.encode('utf-8'))
          PY




