name: Publish sensor 1.0.9 and direct delta update
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-1.0.9.yml'
permissions:
  contents: write
concurrency:
  group: publish-sensor-1.0.9
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify signed release files, mirror assets, then advance manifests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sensor-release-1.0.9"
          cd "$RUNNER_TEMP/sensor-release-1.0.9"
          python3 - <<'PY'
          import os, pathlib, hashlib, json, base64, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          stage = 'https://underwater-sensor-updates-20261104.z2656953367.chatgpt.site/releases/'
          direct = 'https://raw.githubusercontent.com/' + repo + '/main/'
          assets = [
              ('underwater-sensor-1.0.9.apk', 5234945, '1eee1aa777fbf2339547bab256a34ea349391b7401c9e9628fd40dd1b764f833'),
              ('underwater-sensor-1.0.8-to-1.0.9.sud.gz', 281573, 'f12ecc92faa6d902d4aa2eee9bb34eefed479349fa4f141b3a5de555f06c8ee0'),
          ]
          for name, size, sha in assets:
              subprocess.run(['curl', '--fail', '--location', '--silent', '--show-error',
                  '--proto', '=https', '--proto-redir', '=https', '--connect-timeout', '15',
                  '--max-time', '180', '--retry', '2', stage + name, '--output', name], check=True)
              data = pathlib.Path(name).read_bytes()
              assert len(data) == size and hashlib.sha256(data).hexdigest() == sha, 'Release asset verification failed'
              print('Verified release asset:', name, size)
          manifest = {
              'versionCode': 10, 'versionName': '1.0.9',
              'apkUrl': direct + 'packages/underwater-sensor-1.0.9.apk',
              'apkBytes': 5234945,
              'sha256': assets[0][2],
              'notes': '自动电阻监测：点击开始检测后自动执行短时采集与读取，当前电阻和曲线随新返回数据更新，按钮变为红色停止检测。停止后查看本次已保存记录并导出全部Excel。各段之间有通信间隙，曲线分段显示，未宣称无间断采样。采集中保持App前台。从1.0.8可优先使用约282KB差异包。',
              'deltas': [{
                  'fromVersionCode': 9,
                  'baseSha256': 'c3917059ff8f84694124782dfc587b3d01121481fd5823fb0e9b9ab1b0217015',
                  'url': direct + 'packages/underwater-sensor-1.0.8-to-1.0.9.sud.gz',
                  'bytes': 281573, 'sha256': assets[1][2],
              }],
          }
          content = (json.dumps(manifest, ensure_ascii=False, indent=2) + '\n').encode('utf-8')
          pathlib.Path('latest.json').write_bytes(content)
          notes = '''水下传感器 1.0.9（10），Android 6 及以上。
          新增一次点击后的自动电阻监测，目标仍为原BT24-T板。
          开始后自动循环：3031启动，确认后采集1500毫秒，3032读取，显示并保存真实数据，然后下一轮。
          按钮变为红色停止检测；停止后查看本次记录，导出Excel保存整次数据。
          各段之间有采集间隙，曲线不跨段画连续线；不宣称无间断采样。
          图表显示最近800点，整次记录最多保留100000点或10000段。
          Excel保留段号、原始ADC、阻值与时间来源；段内0.5秒沿用原客户端约定，未独立确认硬件采样率。
          检测时保持App前台，进入后台会停止本次App检测并保留已接收数据。
          停止结束App自动循环和记录，未发送未知硬件停止指令。
          78项关联测试通过，同签名差异包可准确重建APK。
          从1.0.8（9）可优先下载281573字节差异包，基包不匹配则下载完整APK。
          手机的连续多轮、实际刷新周期与停止后导出仍需实测。
          此仓库仅发布安装包、差异包和更新信息，不包含源码、签名私钥或测量数据。
          '''
          pathlib.Path('release-notes.md').write_text(notes, encoding='utf-8')
          existing = subprocess.run(['gh','release','view','v1.0.9','--repo',repo], capture_output=True)
          if existing.returncode != 0:
              subprocess.run(['gh','release','create','v1.0.9']+[a[0] for a in assets]+['latest.json',
                  '--repo',repo,'--target',os.environ['GITHUB_SHA'],'--latest',
                  '--title','水下传感器 1.0.9 · 自动电阻监测','--notes-file','release-notes.md'], check=True)
          def put(path, data, immutable=False):
              endpoint = 'repos/' + repo + '/contents/' + path
              result = subprocess.run(['gh','api',endpoint], capture_output=True, text=True)
              previous = json.loads(result.stdout) if result.returncode == 0 else None
              blob = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if previous and previous['sha'] == blob:
                  print('Verified existing content:', path); return
              if immutable and previous:
                  raise RuntimeError('Immutable asset differs: '+path)
              payload = {'message':'Publish verified sensor 1.0.9: '+path,
                  'content':base64.b64encode(data).decode('ascii'), 'branch':'main'}
              if previous: payload['sha'] = previous['sha']
              temporary = pathlib.Path('contents-payload.json')
              temporary.write_text(json.dumps(payload), encoding='utf-8')
              response = subprocess.run(['gh','api','--method','PUT',endpoint,'--input',str(temporary)],
                  capture_output=True, text=True, check=True)
              assert json.loads(response.stdout)['content']['sha'] == blob
              temporary.unlink()
              print('Published:',path)
          # Versioned assets must exist before any phone is offered the new version.
          for name, size, sha in assets: put('packages/'+name, pathlib.Path(name).read_bytes(), True)
          put('updates/latest.json',content)
          put('latest.json',content)
          readme = '''# 水下传感器应用更新
          
          当前版本：1.0.9（10），Android 6 及以上，自动电阻监测。
          
          App更新清单：https://raw.githubusercontent.com/28725535856/underwater-sensor-updates/main/updates/latest.json
          
          从原1.0.8（9）可优先下载约282KB差异包；下载后仍需完成Android系统安装确认。
          
          ## 使用方法
          
          点击开始检测，按钮变为红色停止检测。App自动执行短时采集和读取，数值及曲线根据新返回的数据更新。
          检测时保持App前台；进入后台会结束本次App检测，并保留已接收数据。
          点击停止后，数据读取查看本次已保存记录，导出Excel保存整次数据。
          自动短测各段之间有通信间隙，图表分段显示，不能作为无间断采样记录。
          段内0.5秒是原客户端约定，Excel明确记录段号、时间来源、原始ADC和阻值。
          停止结束App接收与自动循环，未定义或发送硬件停止命令。
          
          78项相关测试、签名和差异还原校验通过。手机实际多轮循环、刷新周期及导出仍需实测。
          此仓库仅发布APK、差异包和更新信息，不包含源码、签名私钥或测量数据。
          '''
          put('README.md',readme.encode('utf-8'))
          PY



